<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>マンホール内部点検</title>
<meta name="theme-color" content="#a8341f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="内部点検">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>

  html{background:#aabbe6;color-scheme:light}
  :root{
    --ink:#14181c; --ink-2:#4d5762; --ink-3:#8a949f;
    --line:#dde3e8; --line-2:#eef2f5;
    --paper:#ffffff; --panel:#f6f8fa;
    --go:#0f6d8c; --warn:#a8341f; --done:#1d7a4d;
    --font:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;
    --num:"Roboto Condensed",var(--font);
  }
  *{box-sizing:border-box}
  body{margin:0;background:#aabbe6;color:var(--ink);font-family:var(--font);
       -webkit-text-size-adjust:100%;padding-bottom:70px}
  .wrap{max-width:620px;margin:0 auto;padding:0 12px}

  /* ヘッダ */
  .bar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);
       padding:9px 10px;display:flex;align-items:center;gap:7px}
  .bar .ttl{font-size:15px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
             min-width:0;overflow:hidden;text-overflow:ellipsis}
  .bar .prog{margin-left:auto;font-family:var(--num);font-size:15px;font-weight:700;
             color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar button{appearance:none;border:1px solid var(--line);background:var(--paper);
       color:var(--ink-2);font-family:var(--font);font-weight:700;font-size:12.5px;
       padding:7px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .bar a.home{appearance:none;border:1px solid var(--line);background:var(--paper);
       color:var(--ink-2);font-family:var(--font);font-weight:700;font-size:12.5px;
       padding:7px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;flex:0 0 auto;
       text-decoration:none;line-height:1;display:inline-flex;align-items:center}

  /* 出発前 */
  .depart{border:2px solid var(--warn);border-radius:12px;padding:13px 14px;margin:14px 0 18px}
  .depart h2{margin:0 0 4px;font-size:16px;font-weight:700;color:var(--warn)}
  .depart p{margin:0 0 9px;font-size:13px;color:var(--ink-2);line-height:1.5}

  /* 現在地カード */
  .card{margin:16px 0;background:var(--paper);border:1px solid var(--line);
        border-radius:14px;padding:15px 14px}
  .num{font-family:var(--num);font-size:15px;font-weight:700;color:var(--ink-3);
       letter-spacing:.08em}
  .name{font-size:23px;font-weight:700;line-height:1.25;margin:2px 0 0}
  .kind{font-size:13px;color:var(--ink-2);margin-top:3px}
  .note{margin-top:11px;border-left:4px solid var(--warn);background:#fdf4f2;
        padding:9px 12px;border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.55;
        color:var(--ink);font-weight:500}
  .note b{color:var(--warn)}

  /* ナビボタン */
  .nav{display:block;width:100%;margin-top:13px;text-align:center;text-decoration:none;
       background:var(--go);color:#fff;font-weight:700;font-size:17px;
       padding:15px;border-radius:11px;letter-spacing:.03em}
  .nav.off{background:var(--panel);color:var(--ink-3);border:1px dashed var(--line)}

  /* チェック */
  ul{list-style:none;margin:15px 0 0;padding:0}
  li label{display:flex;align-items:center;gap:12px;padding:13px 2px;
           border-bottom:1px solid var(--line-2);cursor:pointer;font-size:16.5px;line-height:1.3}
  li:last-child label{border-bottom:0}
  input[type=checkbox]{appearance:none;width:24px;height:24px;flex:0 0 auto;
    border:2px solid var(--ink-3);border-radius:6px;background:var(--paper);cursor:pointer}
  input[type=checkbox]:checked{background:var(--ink);border-color:var(--ink)}
  input[type=checkbox]:checked::after{content:"";display:block;width:6px;height:12px;
    margin:1px 0 0 6px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
  input:checked + .nm{color:var(--ink-3);text-decoration:line-through}
  .nm{flex:1}

  /* 次へ */
  .next{position:fixed;left:0;right:0;bottom:0;background:var(--paper);
        border-top:1px solid var(--line);padding:10px 12px;
        padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .next .inner{max-width:620px;margin:0 auto;display:flex;gap:9px}
  .next button{flex:1;appearance:none;border:0;border-radius:11px;padding:15px;
       font-family:var(--font);font-weight:700;font-size:16.5px;cursor:pointer;
       background:var(--ink);color:#fff}
  .next button.sub{flex:0 0 auto;background:var(--panel);color:var(--ink-2);
       border:1px solid var(--line);padding:15px 17px;font-size:15px}
  .next button:disabled{opacity:.4}

  /* 一覧 */
  .list{margin:12px 0}
  .row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
       appearance:none;background:var(--paper);border:0;border-bottom:1px solid var(--line-2);
       padding:13px 3px;font-family:var(--font);font-size:16px;color:var(--ink);cursor:pointer}
  .row .n{font-family:var(--num);font-weight:700;color:var(--ink-3);flex:0 0 26px}
  .row .t{flex:1}
  .row .s{font-size:12px;font-weight:700;letter-spacing:.06em}
  .row.done .t{color:var(--ink-3);text-decoration:line-through}
  .row.done .s{color:var(--done)}
  .row.cur{background:#f2f8fb}
  .row.cur .n{color:var(--go)}

  .fin{padding:44px 0;text-align:center}
  .fin .big{font-size:21px;font-weight:700}
  .fin .sub{margin-top:7px;font-size:14px;color:var(--ink-2)}
  /* 地区えらび */
  .pick{margin:18px 0;display:flex;flex-direction:column;gap:11px}
  .dbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;appearance:none;
        background:var(--paper);border:1px solid var(--line);border-radius:12px;
        padding:18px 16px;font-family:var(--font);cursor:pointer}
  .dbtn .dn{font-size:21px;font-weight:700;color:var(--ink)}
  .dbtn .ds{font-size:13px;color:var(--ink-2)}
  .dbtn .dp{margin-left:auto;font-family:var(--num);font-size:16px;font-weight:700;color:var(--ink-3);
            font-variant-numeric:tabular-nums}
  .hide{display:none!important}

  /* 内部点検の追加分 */
  .warn2{border:2px solid var(--warn);background:#fdf4f2;border-radius:12px;padding:12px 14px;margin:14px 0}
  .warn2 h2{margin:0 0 5px;font-size:15px;font-weight:700;color:var(--warn)}
  .warn2 p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink)}
  .watch{position:sticky;top:44px;z-index:9;background:var(--warn);color:#fff;border-radius:10px;
         padding:10px 12px;margin:12px 0;font-size:14.5px;font-weight:700;line-height:1.5}
  .sel{margin:14px 0}
  .sel h3{margin:22px 0 6px;font-size:24px;font-weight:700;color:var(--ink);letter-spacing:.06em;
          padding-bottom:5px;border-bottom:2px solid var(--go)}
  .sel h3:first-child{margin-top:6px}
  .go{display:block;width:100%;appearance:none;border:0;border-radius:11px;padding:15px;
      font-family:var(--font);font-weight:700;font-size:17px;color:#fff;background:var(--ink);cursor:pointer}
  .go:disabled{opacity:.35}
</style>
</head>
<body>

<div class="bar">
  <a class="home" href="../index.html">メニュー</a>
  <span class="ttl" id="ttl">マンホール内部点検</span>
  <span class="prog" id="prog"></span>
  <button type="button" id="back">選択</button>
  <button type="button" id="toggle">一覧</button>
  <button type="button" id="reset">リセット</button>
</div>

<div class="wrap">
  <div id="home"></div>
  <div id="load" class="depart hide">
    <h2>積み込み</h2>
    <p>2人以上。上に残る人がこの画面を持つ。</p>
    <ul id="loadList"></ul>
  </div>
  <div id="view"></div>
  <div id="listView" class="list hide"></div>
</div>

<div class="next hide" id="nextBar">
  <div class="inner">
    <button type="button" class="sub" id="prevBtn">戻る</button>
    <button type="button" id="nextBtn">完了 → 次へ</button>
  </div>
</div>

<script>
const SITES = [{"d": "深川", "n": "①", "name": "開西町", "ll": "43.709387623292955,142.0125255851098"}, {"d": "深川", "n": "②", "name": "文光町", "ll": "43.71324809932045,142.02001242337272"}, {"d": "深川", "n": "③", "name": "拓大", "ll": "43.71832825434898,142.02299307627956"}, {"d": "深川", "n": "④", "name": "堺川雨水幹線", "ll": "43.72394108074986,142.04024028999405"}, {"d": "深川", "n": "⑤", "name": "堺町", "ll": "43.72449767468144,142.04596277158336"}, {"d": "深川", "n": "⑥", "name": "北光町", "ll": "43.7325717751852,142.03946540254876"}, {"d": "深川", "n": "⑦", "name": "大鳳川1号雨水幹線", "ll": "43.741234599466424,142.03689621757945"}, {"d": "深川", "n": "⑧", "name": "あけぼの", "ll": "43.74192098244028,142.03810793282625"}, {"d": "深川", "n": "⑨", "name": "桜坂", "ll": "43.743229791218944,142.04079652627135"}, {"d": "深川", "n": "⑩", "name": "稲穂町", "ll": "43.72739356567422,142.05039506985594"}, {"d": "深川", "n": "⑪", "name": "蓬莱町", "ll": "43.724873427770454,142.05609480340163"}, {"d": "深川", "n": "⑫", "name": "二十四孝", "ll": "43.72652871701054,142.06606685192006"}, {"d": "深川", "n": "⑬", "name": "一已8丁目", "ll": "43.72438293768381,142.06724482883993"}, {"d": "深川", "n": "⑭", "name": "陸上競技場", "ll": "43.72307868209763,142.06601417735737"}, {"d": "深川", "n": "⑮", "name": "運動公園", "ll": "43.721856883013416,142.06129340601865"}, {"d": "音江", "n": "", "name": "広里橋ポンプ所", "ll": "43.70280381853278,142.06656391451864"}, {"d": "音江", "n": "", "name": "音江橋ポンプ所", "ll": "43.6976184687923,142.07912590032063"}, {"d": "音江", "n": "", "name": "新橋溜池ポンプ所", "ll": "43.692345437381746,142.06950087778202"}, {"d": "音江", "n": "", "name": "柳橋ポンプ所", "ll": "43.697671875166286,142.05099618312684"}, {"d": "納内", "n": "", "name": "8区マンホールポンプ所", "ll": "43.728732137525526,142.1274779518117"}, {"d": "納内", "n": "", "name": "10区マンホールポンプ所", "ll": "43.726208096751506,142.12972120036534"}, {"d": "多度志", "n": "", "name": "中央ポンプ所", "ll": "43.81021444475322,142.02932797368857"}, {"d": "多度志", "n": "", "name": "弥栄ポンプ所", "ll": "43.81399048467062,142.0319491350166"}, {"d": "多度志", "n": "", "name": "下多度志ポンプ所", "ll": "43.81027829856542,142.02356460896397"}];
const STEPS = [{"t": "車を停める・周囲の安全確保", "w": false}, {"t": "蓋を開ける", "w": false}, {"t": "開口部を板・毛布で養生", "w": false}, {"t": "三脚を立てる（地面の傾きを見る）", "w": false}, {"t": "発電機を始動 → 送風機で換気", "w": false}, {"t": "ガス検知器のセンサーを下へ降ろす", "w": false}, {"t": "酸素と硫化水素を見て、降りられるか判断する", "w": false}, {"t": "安全ブロックを装着", "w": false}, {"t": "下の人が降りる", "w": true}, {"t": "フロートの確認と清掃", "w": true}, {"t": "ポンプの状態を確認（吊るならチェーンブロック）", "w": true}, {"t": "異常が無いか目視", "w": true}, {"t": "オイル交換（やる日のみ）", "w": true}, {"t": "下の人が上がる", "w": true}, {"t": "三脚・安全ブロックを撤収", "w": false}, {"t": "送風機・発電機を止める", "w": false}, {"t": "養生を外す", "w": false}, {"t": "蓋を閉める", "w": false}];
const LOAD = ["発電機の燃料が入っているか（現地で足せない）", "発電機", "送風機とダクト", "ガス検知器（酸素・硫化水素／電池）", "三脚", "チェーンブロック", "安全ブロック", "板・毛布（養生）", "マンホールを開ける道具（バール／フック）", "オイル交換の用具とオイル（やる日のみ）", "車の鍵", "制御盤のカギ", "タブレット"];

const KEY = "naibu_state_v1";
let st = null;
let cur = 0, showList = false;

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
function load(){
  try{ st = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){ st = null; }
  if(st && (!Array.isArray(st.pick) || !st.pick.length)) st = null;
}

const home = document.getElementById("home");
const loadBox = document.getElementById("load");
const loadList = document.getElementById("loadList");
const view = document.getElementById("view");
const listView = document.getElementById("listView");
const ttl = document.getElementById("ttl");
const prog = document.getElementById("prog");
const nextBar = document.getElementById("nextBar");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");
const toggleBtn = document.getElementById("toggle");
const backBtn = document.getElementById("back");
const resetBtn = document.getElementById("reset");

function navUrl(ll){
  return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(ll) + "&travelmode=driving";
}

function renderHome(){
  home.classList.remove("hide");
  loadBox.classList.add("hide"); view.classList.add("hide");
  listView.classList.add("hide"); nextBar.classList.add("hide");
  toggleBtn.classList.add("hide"); backBtn.classList.add("hide"); resetBtn.classList.add("hide");
  ttl.textContent = "マンホール内部点検"; prog.textContent = "";
  const picked = window.__pick || [];
  let h = `<div class="warn2"><h2>入る前に</h2><p>2人以上。上に残る人がこの画面を持つ。
    降りる判断は地上の検知器の値でする。値は記録しない。</p></div><div class="sel">`;
  let last = "";
  SITES.forEach((s,i)=>{
    if(s.d !== last){ h += `<h3>${s.d}</h3>`; last = s.d; }
    h += `<li style="list-style:none"><label><input type="checkbox" data-pick="${i}"${picked.includes(i)?" checked":""}>
      <span class="nm">${s.n ? s.n+" " : ""}${s.name}</span></label></li>`;
  });
  h += `</div><button type="button" class="go" id="goBtn"${picked.length?"":" disabled"}>この${picked.length}か所で始める</button>`;
  home.innerHTML = h;
}

function renderLoad(){
  loadList.innerHTML = LOAD.map((t,i)=>
    `<li><label><input type="checkbox" data-load="${i}"${st.load[i]?" checked":""}><span class="nm">${t}</span></label></li>`).join("");
}

function render(){
  if(!st){ renderHome(); return; }
  home.classList.add("hide");
  toggleBtn.classList.remove("hide"); backBtn.classList.remove("hide"); resetBtn.classList.remove("hide");
  const total = st.pick.length;
  prog.textContent = st.done.filter(Boolean).length + " / " + total;
  ttl.textContent = "内部点検";

  if(showList){
    view.classList.add("hide"); loadBox.classList.add("hide");
    listView.classList.remove("hide"); nextBar.classList.add("hide");
    listView.innerHTML = st.pick.map((si,i)=>{
      const s = SITES[si];
      return `<button type="button" class="row ${st.done[i]?'done':''} ${i===cur?'cur':''}" data-go="${i}">
        ${s.n ? `<span class="n">${s.n}</span>` : ""}<span class="t">${s.d}　${s.name}</span>
        <span class="s">${st.done[i]?'済':''}</span></button>`;
    }).join("");
    return;
  }
  listView.classList.add("hide"); view.classList.remove("hide"); nextBar.classList.remove("hide");
  loadBox.classList.toggle("hide", cur !== 0);

  const s = SITES[st.pick[cur]];
  const watching = STEPS.some((x,i)=> x.w && st.step[cur][i]) && !st.step[cur][13];
  view.innerHTML = `
    <div class="card">
      <div class="num">${s.d}${s.n ? "　"+s.n : ""}</div>
      <div class="name">${s.name}</div>
      ${s.ll ? `<a class="nav" href="${navUrl(s.ll)}" rel="noopener">ここへ案内</a>`
              : `<div class="nav off">座標 未登録</div>`}
      ${watching ? `<div class="watch">下に人がいる。目を離さない。濃度を見続ける。声を掛け合う。</div>` : ``}
      <ul>${STEPS.map((x,i)=>
        `<li><label><input type="checkbox" data-step="${i}"${st.step[cur][i]?" checked":""}><span class="nm">${x.t}</span></label></li>`
      ).join("")}</ul>
    </div>`;
  nextBtn.textContent = cur === st.pick.length - 1 ? "終了" : "完了 → 次へ";
  prevBtn.disabled = cur === 0;
}

home.addEventListener("change", e=>{
  const t = e.target;
  if(!t.dataset || t.dataset.pick === undefined) return;
  window.__pick = window.__pick || [];
  const i = +t.dataset.pick;
  if(t.checked){ if(!window.__pick.includes(i)) window.__pick.push(i); }
  else window.__pick = window.__pick.filter(x=>x!==i);
  window.__pick.sort((a,b)=>a-b);
  const b = document.getElementById("goBtn");
  b.disabled = !window.__pick.length;
  b.textContent = "この" + window.__pick.length + "か所で始める";
});
home.addEventListener("click", e=>{
  if(!e.target.closest("#goBtn")) return;
  const pick = (window.__pick||[]).slice();
  if(!pick.length) return;
  st = {pick, cur:0, done:pick.map(()=>false),
        step:pick.map(()=>STEPS.map(()=>false)), load:LOAD.map(()=>false)};
  cur = 0; showList = false; toggleBtn.textContent = "一覧";
  save(); renderLoad(); render();
});
backBtn.addEventListener("click", ()=>{
  if(!window.confirm("選び直す？今の進捗は消える")) return;
  window.__pick = st ? st.pick.slice() : [];
  st = null; try{ localStorage.removeItem(KEY); }catch(e){}
  showList = false; render();
});
resetBtn.addEventListener("click", ()=>{
  if(!st) return;
  if(!window.confirm("この" + st.pick.length + "か所を最初からやり直す？")) return;
  st = {pick: st.pick.slice(), cur:0, done: st.pick.map(()=>false),
        step: st.pick.map(()=>STEPS.map(()=>false)), load: LOAD.map(()=>false)};
  cur = 0; showList = false; toggleBtn.textContent = "一覧";
  save(); renderLoad(); render();
});
toggleBtn.addEventListener("click", ()=>{
  showList = !showList;
  toggleBtn.textContent = showList ? "戻る" : "一覧";
  render();
});
document.addEventListener("change", e=>{
  const t = e.target;
  if(!t.dataset || !st) return;
  if(t.dataset.step !== undefined){ st.step[cur][+t.dataset.step] = t.checked; save(); render(); }
  else if(t.dataset.load !== undefined){ st.load[+t.dataset.load] = t.checked; save(); }
});
listView.addEventListener("click", e=>{
  const b = e.target.closest("[data-go]");
  if(!b) return;
  cur = +b.dataset.go; st.cur = cur; showList = false;
  toggleBtn.textContent = "一覧"; save(); render();
});
nextBtn.addEventListener("click", ()=>{
  st.done[cur] = true;
  if(cur < st.pick.length - 1){ cur++; st.cur = cur; window.scrollTo(0,0); }
  else { showList = true; toggleBtn.textContent = "戻る"; }
  save(); render();
});
prevBtn.addEventListener("click", ()=>{
  if(cur > 0){ cur--; st.cur = cur; window.scrollTo(0,0); save(); render(); }
});

load();
if(st){ cur = st.cur || 0; renderLoad(); }
render();
</script>

</body>
</html>
