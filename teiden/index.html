<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>停電対応手順</title>
<meta name="theme-color" content="#a8341f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="停電">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>

  html{background:#aabbe6;color-scheme:light}
  :root{
    --ink:#14181c; --ink-2:#4d5762; --ink-3:#8a949f;
    --line:#dde3e8; --line-2:#eef2f5;
    --paper:#ffffff; --panel:#f6f8fa;
    --go:#0f6d8c; --warn:#a8341f; --done:#1d7a4d;
    --font:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;
    --num:"Roboto Condensed",var(--font);
  }
  *{box-sizing:border-box}
  body{margin:0;background:#aabbe6;color:var(--ink);font-family:var(--font);
       -webkit-text-size-adjust:100%;padding-bottom:70px}
  .wrap{max-width:620px;margin:0 auto;padding:0 12px}

  /* ヘッダ */
  .bar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);
       padding:9px 10px;display:flex;align-items:center;gap:7px}
  .bar .ttl{font-size:15px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
             min-width:0;overflow:hidden;text-overflow:ellipsis}
  .bar .prog{margin-left:auto;font-family:var(--num);font-size:15px;font-weight:700;
             color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar button{appearance:none;border:1px solid var(--line);background:var(--paper);
       color:var(--ink-2);font-family:var(--font);font-weight:700;font-size:12.5px;
       padding:7px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .bar a.home{appearance:none;border:1px solid var(--line);background:var(--paper);
       color:var(--ink-2);font-family:var(--font);font-weight:700;font-size:12.5px;
       padding:7px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;flex:0 0 auto;
       text-decoration:none;line-height:1;display:inline-flex;align-items:center}

  /* 出発前 */
  .depart{border:2px solid var(--warn);border-radius:12px;padding:13px 14px;margin:14px 0 18px}
  .depart h2{margin:0 0 4px;font-size:16px;font-weight:700;color:var(--warn)}
  .depart p{margin:0 0 9px;font-size:13px;color:var(--ink-2);line-height:1.5}

  /* 現在地カード */
  .card{margin:16px 0;background:var(--paper);border:1px solid var(--line);
        border-radius:14px;padding:15px 14px}
  .num{font-family:var(--num);font-size:15px;font-weight:700;color:var(--ink-3);
       letter-spacing:.08em}
  .name{font-size:23px;font-weight:700;line-height:1.25;margin:2px 0 0}
  .kind{font-size:13px;color:var(--ink-2);margin-top:3px}
  .note{margin-top:11px;border-left:4px solid var(--warn);background:#fdf4f2;
        padding:9px 12px;border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.55;
        color:var(--ink);font-weight:500}
  .note b{color:var(--warn)}

  /* ナビボタン */
  .nav{display:block;width:100%;margin-top:13px;text-align:center;text-decoration:none;
       background:var(--go);color:#fff;font-weight:700;font-size:17px;
       padding:15px;border-radius:11px;letter-spacing:.03em}
  .nav.off{background:var(--panel);color:var(--ink-3);border:1px dashed var(--line)}

  /* チェック */
  ul{list-style:none;margin:15px 0 0;padding:0}
  li label{display:flex;align-items:center;gap:12px;padding:13px 2px;
           border-bottom:1px solid var(--line-2);cursor:pointer;font-size:16.5px;line-height:1.3}
  li:last-child label{border-bottom:0}
  input[type=checkbox]{appearance:none;width:24px;height:24px;flex:0 0 auto;
    border:2px solid var(--ink-3);border-radius:6px;background:var(--paper);cursor:pointer}
  input[type=checkbox]:checked{background:var(--ink);border-color:var(--ink)}
  input[type=checkbox]:checked::after{content:"";display:block;width:6px;height:12px;
    margin:1px 0 0 6px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
  input:checked + .nm{color:var(--ink-3);text-decoration:line-through}
  .nm{flex:1}

  /* 次へ */
  .next{position:fixed;left:0;right:0;bottom:0;background:var(--paper);
        border-top:1px solid var(--line);padding:10px 12px;
        padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .next .inner{max-width:620px;margin:0 auto;display:flex;gap:9px}
  .next button{flex:1;appearance:none;border:0;border-radius:11px;padding:15px;
       font-family:var(--font);font-weight:700;font-size:16.5px;cursor:pointer;
       background:var(--ink);color:#fff}
  .next button.sub{flex:0 0 auto;background:var(--panel);color:var(--ink-2);
       border:1px solid var(--line);padding:15px 17px;font-size:15px}
  .next button:disabled{opacity:.4}

  /* 一覧 */
  .list{margin:12px 0}
  .row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
       appearance:none;background:var(--paper);border:0;border-bottom:1px solid var(--line-2);
       padding:13px 3px;font-family:var(--font);font-size:16px;color:var(--ink);cursor:pointer}
  .row .n{font-family:var(--num);font-weight:700;color:var(--ink-3);flex:0 0 26px}
  .row .t{flex:1}
  .row .s{font-size:12px;font-weight:700;letter-spacing:.06em}
  .row.done .t{color:var(--ink-3);text-decoration:line-through}
  .row.done .s{color:var(--done)}
  .row.cur{background:#f2f8fb}
  .row.cur .n{color:var(--go)}

  .fin{padding:44px 0;text-align:center}
  .fin .big{font-size:21px;font-weight:700}
  .fin .sub{margin-top:7px;font-size:14px;color:var(--ink-2)}
  /* 地区えらび */
  .pick{margin:18px 0;display:flex;flex-direction:column;gap:13px}
  .dbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;appearance:none;
        background:var(--paper);border:1px solid var(--line);border-radius:14px;
        padding:26px 18px;font-family:var(--font);cursor:pointer}
  .dbtn .dn{font-size:30px;font-weight:700;color:var(--ink);letter-spacing:.04em}
  .dbtn .ds{font-size:15px;color:var(--ink-2)}
  .dbtn .dp{margin-left:auto;font-family:var(--num);font-size:19px;font-weight:700;color:var(--ink-3);
            font-variant-numeric:tabular-nums}
  .hide{display:none!important}

  .pick{margin:16px 0;display:flex;flex-direction:column;gap:10px}
  .dbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;appearance:none;
        background:var(--paper);border:1px solid var(--line);border-radius:12px;
        padding:16px;font-family:var(--font);cursor:pointer}
  .dbtn .dn{font-size:19px;font-weight:700;color:var(--ink)}
  .dbtn .dp{margin-left:auto;font-family:var(--num);font-size:14px;font-weight:700;color:var(--ink-3)}
  .lead{margin:14px 0;padding:12px 14px;border:2px solid var(--warn);border-radius:12px;background:#fdf4f2}
  .lead h2{margin:0 0 4px;font-size:15px;font-weight:700;color:var(--warn)}
  .lead p{margin:0;font-size:14px;line-height:1.55;color:var(--ink)}
  .tabs{display:flex;gap:7px;margin:14px 0 4px}
  .tab{flex:1;appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
       border-radius:10px;padding:11px 4px;font-family:var(--font);font-weight:700;font-size:13.5px;cursor:pointer}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .sec h2{font-size:17px;font-weight:700;margin:16px 0 0}
  .calls{margin:16px 0 4px}
  .calls h3{margin:0 0 7px;font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:.06em}
  .call{display:flex;align-items:center;gap:11px;width:100%;text-decoration:none;
        background:var(--paper);border:2px solid var(--warn);border-radius:11px;
        padding:13px 14px;margin-bottom:8px}
  .call .cn{font-size:16px;font-weight:700;color:var(--ink)}
  .call .ct{margin-left:auto;font-family:var(--num);font-size:15px;font-weight:700;color:var(--warn)}
  .call.todo{border-style:dashed;border-color:var(--line);opacity:.75}
  .call.todo .ct{color:var(--ink-3)}
</style>
</head>
<body>

<div class="bar">
  <a class="home" href="../index.html">メニュー</a>
  <span class="ttl" id="ttl">停電対応手順</span>
  <span class="prog" id="prog"></span>
  <button type="button" id="back" class="hide">施設</button>
  <button type="button" id="reset" class="hide">リセット</button>
</div>

<div class="wrap">
  <div id="home"></div>
  <div id="view"></div>
</div>

const CALLS = [
  {n:"責任者", t:"000-0000-0000"},
  {n:"電気保安協会", t:"000-0000-0000"},
  {n:"深川浄化センター", t:"000-0000-0000"}
];

const KEY = "teiden_state_v1";
let fi = -1, tab = "a";
let st = {};

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
function load(){
  try{ st = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; }catch(e){ st = {}; }
  F.forEach(f=>{
    if(!st[f.id]) st[f.id] = {};
    ["a","b","f"].forEach(k=>{
      if(!Array.isArray(st[f.id][k]) || st[f.id][k].length !== f[k].length) st[f.id][k] = f[k].map(()=>false);
    });
  });
}

const home = document.getElementById("home");
const view = document.getElementById("view");
const ttl = document.getElementById("ttl");
const prog = document.getElementById("prog");
const backBtn = document.getElementById("back");
const resetBtn = document.getElementById("reset");

function renderHome(){
  home.classList.remove("hide"); view.classList.add("hide");
  backBtn.classList.add("hide"); resetBtn.classList.add("hide");
  ttl.textContent = "停電対応手順"; prog.textContent = "";
  home.innerHTML = `<div class="lead"><h2>まず受電電圧を見る</h2>
    <p>施設を選ぶと、<b>0V（北電側停電）</b>・<b>施設側停電</b>・<b>復電</b>の3つに分かれる。</p></div>
    <div class="pick">` + F.map((f,i)=>
    `<button type="button" class="dbtn" data-f="${i}"><span class="dn">${f.name}</span>
     <span class="dp">${f.volt}</span></button>`).join("") + `</div>`;
}

function renderView(){
  home.classList.add("hide"); view.classList.remove("hide");
  backBtn.classList.remove("hide"); resetBtn.classList.remove("hide");
  const f = F[fi], s = st[f.id];
  ttl.textContent = f.name;
  const list = f[tab];
  const cnt = s[tab].filter(Boolean).length;
  prog.textContent = cnt + " / " + list.length;
  const label = {a:"0V<br>北電側", b:f.volt+"<br>施設側", f:"復電"};
  view.innerHTML = `
    <div class="lead"><h2>確認する場所</h2><p>${f.where}</p></div>
    <div class="tabs">
      ${["a","b","f"].map(k=>`<button type="button" class="tab ${k===tab?'on':''}" data-tab="${k}">${label[k]}</button>`).join("")}
    </div>
    <div class="card">
      <ul>${list.map((t,i)=>
        `<li><label><input type="checkbox" data-step="${i}"${s[tab][i]?" checked":""}><span class="nm">${t}</span></label></li>`
      ).join("")}</ul>
    </div>
    <div class="calls"><h3>連絡先</h3>
      ${CALLS.map(c=>`<a class="call todo" href="tel:${c.t.replace(/-/g,"")}">
        <span class="cn">${c.n}</span><span class="ct">${c.t}</span></a>`).join("")}
    </div>
    ${f.r && f.r.length ? `<div class="note">${f.r.join("<br>・")}</div>` : ""}`;
}

function render(){ if(fi < 0) renderHome(); else renderView(); }

home.addEventListener("click", e=>{
  const b = e.target.closest("[data-f]");
  if(!b) return;
  fi = +b.dataset.f; tab = "a"; window.scrollTo(0,0); render();
});
view.addEventListener("click", e=>{
  const b = e.target.closest("[data-tab]");
  if(!b) return;
  tab = b.dataset.tab; window.scrollTo(0,0); render();
});
backBtn.addEventListener("click", ()=>{ fi = -1; render(); });
resetBtn.addEventListener("click", ()=>{
  if(!window.confirm(F[fi].name + "のチェックを全部外す？")) return;
  const f = F[fi];
  ["a","b","f"].forEach(k=> st[f.id][k] = f[k].map(()=>false));
  save(); render();
});
document.addEventListener("change", e=>{
  const t = e.target;
  if(!t.dataset || t.dataset.step === undefined || fi < 0) return;
  st[F[fi].id][tab][+t.dataset.step] = t.checked; save();
});

load(); render();
</script>
